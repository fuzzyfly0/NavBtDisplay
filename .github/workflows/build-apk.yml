name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Optional: a fixed debug key, so every build installs over the previous one.
      # Without the secret, Gradle creates a new debug key on every run.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Test and build
        run: sh ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: NavBtDisplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
